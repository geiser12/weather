# Generate Texas weather maps on a schedule and publish to GitHub Pages.
#
# Setup once in the repo:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Manual run: Actions → "Update Texas Weather" → Run workflow

name: Update Texas Weather

on:
  schedule:
    # ~every 6 hours (UTC). Adjust to taste.
    # GitHub cron can drift ±15 min under load.
    - cron: "20 0,6,12,18 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

# Only one weather update at a time
concurrency:
  group: texas-weather-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate maps
        run: python texas_weather_viewer.py

      - name: Prepare Pages artifact
        run: |
          test -f texas_weather/index.html
          test -d texas_weather/images
          du -sh texas_weather texas_weather/images || true
          find texas_weather/images -type f | wc -l

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: texas_weather

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4