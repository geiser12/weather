# Generate Texas weather maps on a schedule and publish to GitHub Pages.
#
# Setup once in the repo:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Manual run: Actions → "Update Texas Weather" → Run workflow

name: Update Texas Weather

on:
  schedule:
    # Every 2 hours at :20 past the hour (UTC).
    # GitHub cron can drift ±15 min under load.
    - cron: "20 */2 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

# Only one weather update at a time
concurrency:
  group: texas-weather-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate maps
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          echo "Repo root: $(pwd)"
          ls -la
          test -f texas_weather_viewer.py
          python texas_weather_viewer.py
          echo "After script:"
          ls -la texas_weather 2>/dev/null || echo "texas_weather/ missing"

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          echo "Workspace contents:"
          ls -la
          echo "---"
          if [ ! -d texas_weather ]; then
            echo "::error::texas_weather/ directory was not created by the script."
            echo "Check the Generate maps step log for Python errors / fetch deadline."
            exit 1
          fi
          ls -la texas_weather
          if [ ! -f texas_weather/index.html ]; then
            echo "::error::texas_weather/index.html missing — script did not finish."
            exit 1
          fi
          if [ ! -d texas_weather/images ]; then
            echo "::error::texas_weather/images/ missing — no maps were written."
            exit 1
          fi
          echo "Artifact size:"
          du -sh texas_weather texas_weather/images
          echo "Image count: $(find texas_weather/images -type f | wc -l)"
          test -f texas_weather/grid_data.js || echo "::warning::grid_data.js missing (probe will not work)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: texas_weather

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4